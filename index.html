<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Grocery Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f8f5; }
        header { display: flex; justify-content: space-between; align-items: center; background: #2e7d32; color: white; padding: 15px 30px; border-radius: 8px; }
        .cart-btn { background: #ff9800; color: white; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
        .card h3 { margin: 10px 0 5px; }
        .price { color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
        .add-btn { background: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .add-btn:hover { background: #1b5e20; }
        #cart-modal { display: none; position: fixed; top: 0; right: 0; width: 300px; height: 100%; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.2); padding: 20px; box-sizing: border-box; }
        #cart-modal.open { display: block; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; cursor: pointer; float: right; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

    <header>
        <h1>🥦 Fresh Grocery Store</h1>
        <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=300" alt="Onions">
            <h3>Onions</h3>
            <div class="price">KSh 100 / kg</div>
            <button class="add-btn" onclick="addToCart('Onions')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300" alt="Tomatoes">
            <h3>Tomatoes</h3>
            <div class="price">KSh 120 / kg</div>
            <button class="add-btn" onclick="addToCart('Tomatoes')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=300" alt="Potatoes">
            <h3>Potatoes</h3>
            <div class="price">KSh 150 / kg</div>
            <button class="add-btn" onclick="addToCart('Potatoes')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=300" alt="Kales">
            <h3>Kales</h3>
            <div class="price">KSh 50 / bunch</div>
            <button class="add-btn" onclick="addToCart('Kales')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300" alt="Bananas">
            <h3>Bananas</h3>
            <div class="price">KSh 80 / bunch</div>
            <button class="add-btn" onclick="addToCart('Bananas')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1546173159-315724a31696?w=300" alt="Mango Juice">
            <h3>Mango Juice</h3>
            <div class="price">KSh 200 / L</div>
            <button class="add-btn" onclick="addToCart('Mango Juice')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1622484210800-88510741e82e?w=300" alt="Sugarcane Juice">
            <h3>Sugarcane Juice</h3>
            <div class="price">KSh 150 / L</div>
            <button class="add-btn" onclick="addToCart('Sugarcane Juice')">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?w=300" alt="Passion Juice">
            <h3>Passion Juice</h3>
            <div class="price">KSh 200 / L</div>
            <button class="add-btn" onclick="addToCart('Passion Juice')">Add to Cart</button>
        </div>
    </div>

    <div id="cart-modal">
        <button class="close-btn" onclick="toggleCart()">X</button>
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
    </div>

    <script>
        let cart = [];
        function addToCart(item) {
            cart.push(item);
            document.getElementById('cart-count').innerText = cart.length;
            renderCart();
        }
        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('open');
        }
        function renderCart() {
            const list = document.getElementById('cart-items');
            list.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
